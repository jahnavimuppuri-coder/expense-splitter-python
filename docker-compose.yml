services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenseuser
      POSTGRES_PASSWORD: expensepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenseuser -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://expenseuser:expensepass@postgres:5432/expenses
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  expense-splitter:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://expenseuser:expensepass@postgres:5432/expenses
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data: