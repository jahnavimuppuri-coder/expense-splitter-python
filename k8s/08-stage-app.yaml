
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-splitter
  namespace: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-splitter
  template:
    metadata:
      labels:
        app: expense-splitter
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: expense-splitter
          image: jahnavigayathri/expense-splitter-python:stage
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-db-secret
                  key: password
            - name: DATABASE_URL
              value: "postgresql://expenseuser:$(DB_PASSWORD)@postgres:5432/expenses"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: expense-splitter
  namespace: stage
spec:
  selector:
    app: expense-splitter
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
